<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Interactive Page</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-card">
      <h1>My Interactive Page</h1>
      <p>Enter your name to receive a greeting.</p>

      <label for="name-input">Your name</label>
      <input id="name-input" type="text" placeholder="Enter your name" />
      <button id="greet-button" type="button">Say hello</button>

      <p id="greeting-message" aria-live="polite"></p>
      <button id="theme-button" type="button">Use dark theme</button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
